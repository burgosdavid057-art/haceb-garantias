<!-- Widget del asistente. Ocupa el lugar exacto donde haceb.com tiene el
     botón flotante de WhatsApp (fixed, bottom 70px, right 24px, 55x55). -->

<button class="fab-bot" id="fabBot" aria-label="Abrir asistente Haceb">
  <span class="punto"></span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="8" width="18" height="12" rx="3"/>
    <circle cx="8.5" cy="14" r="1.4" fill="currentColor" stroke="none"/>
    <circle cx="15.5" cy="14" r="1.4" fill="currentColor" stroke="none"/>
    <path d="M12 8V4M12 4h-2M12 4h2"/>
    <path d="M3 12H1.5M21 12h1.5"/>
  </svg>
</button>

<section class="chat" id="chat" aria-live="polite">
  <div class="chat-top">
    <div class="av">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <rect x="3" y="8" width="18" height="12" rx="3"/>
        <circle cx="8.5" cy="14" r="1.3" fill="currentColor" stroke="none"/>
        <circle cx="15.5" cy="14" r="1.3" fill="currentColor" stroke="none"/>
        <path d="M12 8V4"/>
      </svg>
    </div>
    <div>
      <div class="n">Asistente Haceb</div>
      <div class="s" id="chatEstado">en línea</div>
    </div>
    <button class="cerrar" id="chatCerrar" aria-label="Cerrar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="chat-cuerpo" id="chatCuerpo"></div>

  <div class="sugerencias" id="chatSugerencias">
    <button data-t="Tengo la orden SA-373770, ¿por qué me cobraron si está en garantía?">¿Por qué me cobraron?</button>
    <button data-t="Mi nevera 9003548 no enfría abajo, ¿qué reviso?">Mi nevera no enfría</button>
    <button data-t="Recomiéndame una nevera con 2 millones">Recomiéndame una nevera</button>
  </div>

  <form class="chat-barra" id="chatForm">
    <button type="button" class="clip" id="chatClip" aria-label="Adjuntar orden de servicio" title="Adjuntar foto de tu orden de servicio">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <path d="M21 11l-8.5 8.5a5 5 0 01-7-7L14 4a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 6"/>
      </svg>
    </button>
    <input type="file" id="chatArchivo" accept="image/*" hidden>
    <input type="text" id="chatTexto" placeholder="Escribe tu mensaje" autocomplete="off">
    <button type="submit" id="chatEnviar" aria-label="Enviar">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </form>
</section>
