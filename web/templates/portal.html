<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de Garantías · Haceb (interno)</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/haceb.css') }}">
<style>
/* Portal interno: densidad de herramienta de trabajo, no de sitio de marca.
   El rojo aquí significa UNA sola cosa — "esto no se pudo respaldar" — y no se
   usa para ningún otro fin, para que el asesor sepa qué mirar primero. */
body { background: var(--fondo); }

.cabeza-portal {
  background: var(--carbon); color: var(--blanco);
  padding: 13px 22px; display: flex; align-items: center; gap: 14px;
}
.cabeza-portal svg { height: 24px; }
.cabeza-portal .t { font-weight: 600; font-size: 14px; }
.cabeza-portal .etq {
  background: var(--lima); color: var(--negro); font-size: 10px; font-weight: 700;
  padding: 3px 9px; border-radius: 10px; text-transform: uppercase; letter-spacing: .04em;
}
.cabeza-portal .der { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 12.5px; }
.cabeza-portal button {
  background: none; border: 1px solid #555; color: #ddd; border-radius: 4px;
  padding: 6px 13px; cursor: pointer; font-family: inherit; font-size: 12px;
}
.cabeza-portal button:hover { border-color: var(--lima); color: var(--lima); }

/* --- Ingreso --- */
.ingreso { max-width: 370px; margin: 70px auto; background: var(--blanco);
           border-radius: 8px; padding: 34px; box-shadow: var(--sombra); }
.ingreso h1 { font-size: 19px; margin: 0 0 6px; }
.ingreso p  { color: var(--gris-claro); font-size: 12.5px; margin: 0 0 22px; }
.ingreso label { display: block; font-size: 12px; font-weight: 600; margin: 14px 0 5px; }
.ingreso input {
  width: 100%; padding: 10px 13px; border: 1px solid var(--linea);
  border-radius: 5px; font-size: 13px; font-family: inherit; outline: none;
}
.ingreso input:focus { border-color: var(--lima); }
.ingreso .btn-primario { width: 100%; justify-content: center; margin-top: 20px; }
.ingreso .error { color: var(--rojo); font-size: 12px; margin-top: 12px; display: none; }
.ingreso .pista { margin-top: 20px; padding: 11px; background: var(--fondo-suave);
                  border-radius: 5px; font-size: 11.5px; color: var(--gris); }

/* --- Bandeja --- */
.portal { display: none; padding: 22px; max-width: 1500px; margin: 0 auto; }
.portal.activo { display: block; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { background: var(--blanco); border-radius: 7px; padding: 15px 17px; border-left: 3px solid var(--linea); }
.kpi .n { font-size: 26px; font-weight: 700; line-height: 1; }
.kpi .e { font-size: 11.5px; color: var(--gris-claro); margin-top: 5px; }
.kpi.pendiente { border-left-color: var(--rojo); }
.kpi.revision  { border-left-color: var(--ambar); }
.kpi.aprobada  { border-left-color: var(--teal-osc); }

.tablero { display: grid; grid-template-columns: 380px 1fr; gap: 18px; align-items: start; }

.lista { background: var(--blanco); border-radius: 7px; overflow: hidden; }
.lista .filtros-estado { display: flex; gap: 5px; padding: 12px; border-bottom: 1px solid var(--linea); flex-wrap: wrap; }
.lista .filtros-estado button {
  border: 1px solid var(--linea); background: var(--blanco); border-radius: 13px;
  padding: 5px 11px; font-size: 11.5px; cursor: pointer; font-family: inherit;
}
.lista .filtros-estado button.on { background: var(--carbon); color: var(--blanco); border-color: var(--carbon); }

.caso {
  padding: 13px 15px; border-bottom: 1px solid var(--fondo); cursor: pointer;
  border-left: 3px solid transparent;
}
.caso:hover { background: var(--fondo-suave); }
.caso.sel { background: var(--lima-claro); border-left-color: var(--lima); }
.caso .fila1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.caso .tk { font-weight: 700; font-size: 12.5px; }
.caso .pr { font-size: 12px; color: var(--gris); margin-top: 3px; }
.caso .mt { font-size: 11px; color: var(--gris-claro); margin-top: 4px; }
.caso.alerta .tk::after {
  content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--rojo); margin-left: 7px; vertical-align: middle;
}
table.lineas td.sí svg, table.lineas td.no svg, table.lineas td.duda svg { width: 14px; height: 14px; vertical-align: -2px; }
.ok-guardado svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 3px; }

.pill { font-size: 10px; padding: 3px 8px; border-radius: 9px; font-weight: 600; white-space: nowrap; }
.pill.Pendiente        { background: #fde8e8; color: #a12c2c; }
.pill.En-revisión      { background: #fdf1dd; color: #8a5a12; }
.pill.Aprobada         { background: #dff3ee; color: #10685a; }
.pill.Rechazada        { background: #eee; color: #555; }
.pill.Info-solicitada  { background: #e4eefb; color: #24568f; }

.detalle { background: var(--blanco); border-radius: 7px; padding: 22px; min-height: 420px; }
.detalle .vacio { color: var(--gris-claro); text-align: center; padding: 90px 20px; font-size: 13px; }
.detalle h2 { font-size: 17px; margin: 0 0 3px; }
.detalle .sub { color: var(--gris-claro); font-size: 12.5px; margin-bottom: 20px; }

.bloques { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 11px; margin-bottom: 20px; }
.bloque { background: var(--fondo-suave); border-radius: 6px; padding: 12px 14px; }
.bloque .k { font-size: 10.5px; color: var(--gris-claro); text-transform: uppercase; letter-spacing: .04em; }
.bloque .v { font-size: 13.5px; font-weight: 600; margin-top: 4px; }

.veredicto { padding: 11px 15px; border-radius: 6px; color: #fff; font-weight: 600; margin-bottom: 16px; font-size: 13px; }
.veredicto.cubierta_total    { background: var(--teal-osc); }
.veredicto.cubierta_parcial  { background: var(--ambar); }
.veredicto.no_cubierta       { background: var(--gris); }
.veredicto.excluida          { background: var(--gris); }
.veredicto.requiere_revision { background: var(--rojo); }

table.lineas { width: 100%; border-collapse: collapse; margin-bottom: 18px; font-size: 12.5px; }
table.lineas th {
  text-align: left; padding: 8px 10px; background: var(--fondo-suave);
  font-size: 11px; color: var(--gris); text-transform: uppercase; letter-spacing: .04em;
}
table.lineas td { padding: 9px 10px; border-bottom: 1px solid var(--fondo); vertical-align: top; }
table.lineas .num { text-align: right; white-space: nowrap; }
table.lineas .motivo { font-size: 11px; color: var(--gris); margin-top: 3px; }
/* Línea que el motor no pudo respaldar: lo único rojo del portal. */
tr.dudosa td { background: rgba(214,69,69,.06); }
tr.dudosa td:first-child { border-left: 3px solid var(--rojo); }
.sí { color: var(--teal-osc); font-weight: 700; }
.no { color: var(--gris-claro); font-weight: 700; }
.duda { color: var(--rojo); font-weight: 700; }
tfoot td { font-weight: 700; border-top: 2px solid var(--linea); }

.aviso-revision {
  background: rgba(214,69,69,.07); border-left: 3px solid var(--rojo);
  padding: 12px 15px; border-radius: 0 6px 6px 0; font-size: 12.5px; margin-bottom: 18px; line-height: 1.5;
}
.legal { background: var(--fondo-suave); border-radius: 6px; padding: 13px 15px; font-size: 12px;
         color: var(--gris); line-height: 1.55; margin-bottom: 18px; }
.legal b { color: var(--texto); }

.acciones-caso { border-top: 1px solid var(--linea); padding-top: 18px; }
.acciones-caso textarea {
  width: 100%; border: 1px solid var(--linea); border-radius: 6px; padding: 10px 12px;
  font-family: inherit; font-size: 12.5px; resize: vertical; min-height: 62px; outline: none;
}
.acciones-caso textarea:focus { border-color: var(--lima); }
.botones { display: flex; gap: 9px; margin-top: 12px; flex-wrap: wrap; }
.botones button {
  border: none; border-radius: 5px; padding: 10px 18px; font-weight: 600;
  cursor: pointer; font-family: inherit; font-size: 12.5px;
}
.b-aprobar  { background: var(--teal-osc); color: #fff; }
.b-rechazar { background: #e5e5e5; color: var(--texto); }
.b-info     { background: #dce9f8; color: #24568f; }
.botones button:hover { filter: brightness(.94); }
.ok-guardado { color: var(--teal-osc); font-size: 12.5px; margin-top: 10px; display: none; }

@media (max-width: 1000px) { .tablero { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="cabeza-portal">
  <svg viewBox="0 0 132 34" xmlns="http://www.w3.org/2000/svg">
    <path d="M14 2 L118 2 L128 17 L118 32 L14 32 L4 17 Z" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="66" y="23" font-family="Georgia, serif" font-size="18" font-style="italic"
          text-anchor="middle" fill="#fff">Haceb</text>
  </svg>
  <span class="t">Portal de Garantías</span>
  <span class="etq">Uso interno</span>
  <div class="der" id="sesion" style="display:none">
    <span id="quien"></span>
    <button id="salir">Salir</button>
  </div>
</div>

<div class="ingreso" id="ingreso">
  <h1>Bandeja de garantías</h1>
  <p>Acceso para asesores de Servicio Haceb.</p>
  <form id="formIngreso">
    <label for="usuario">Usuario</label>
    <input id="usuario" autocomplete="username" value="asesor">
    <label for="clave">Contraseña</label>
    <input id="clave" type="password" autocomplete="current-password">
    <button class="btn-primario" type="submit">Ingresar</button>
    <div class="error" id="errorIngreso"></div>
  </form>
  <div class="pista">Demo · usuario <b>asesor</b> · clave <b>haceb2026</b></div>
</div>

<main class="portal" id="portal">
  <div class="kpis" id="kpis"></div>
  <div class="tablero">
    <aside class="lista">
      <div class="filtros-estado" id="filtros"></div>
      <div id="listaCasos"></div>
    </aside>
    <section class="detalle" id="detalle">
      <div class="vacio">Selecciona un caso de la bandeja para revisarlo.</div>
    </section>
  </div>
</main>

<script src="{{ url_for('static', filename='js/iconos.js') }}"></script>
<script src="{{ url_for('static', filename='js/portal.js') }}"></script>
</body>
</html>
